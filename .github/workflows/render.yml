name: Render Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Remotion Video Render (4x Concurrency)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies for Chromium & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Render Full 1080p Documentary (Video)
        run: npx remotion render Video out/video.mp4 --concurrency=4

      - name: Render Thumbnail
        run: npx remotion still Thumbnail out/thumbnail.png

      - name: Upload Rendered MP4 Video & Thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: remotion-rendered-video
          path: |
            out/video.mp4
            out/thumbnail.png
          retention-days: 14
